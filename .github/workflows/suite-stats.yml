name: Refresh Compare Empire stats

# Once a day, read what every Compare Empire site publishes about itself
# (scripts/suite-stats.mjs), commit src/data/suite-live.json and dispatch
# deploy.yml so the site rebuilds with the new figures (a push made with the
# Actions token does not start other workflows by itself). A day with no
# change commits nothing and deploys nothing.
on:
  schedule:
    - cron: "40 2 * * *" # after the sites' own morning imports
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: suite-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/cool-dirac-4or2md

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read every site's public data
        run: node scripts/suite-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/suite-live.json
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Refresh Compare Empire stats ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        id: commit

      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref claude/cool-dirac-4or2md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
